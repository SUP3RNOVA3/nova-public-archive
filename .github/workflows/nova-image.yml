name: NOVA image
on:
  pull_request:
    branches: [nova/main]
  push:
    branches: [nova/main]
    tags: ['nova-v*']
  workflow_dispatch:
permissions:
  contents: read
concurrency:
  group: nova-image-${{ github.ref }}
  cancel-in-progress: false
jobs:
  build:
    runs-on: ubuntu-latest
    timeout-minutes: 35
    permissions:
      contents: read
      packages: write
    env:
      ELECTRON_SKIP_BINARY_DOWNLOAD: '1'
      ELECTRON_STATIC: '1'
      NEXT_TELEMETRY_DISABLED: '1'
      NODE_OPTIONS: --max-old-space-size=6144
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22.23.0'
          cache: npm
          cache-dependency-path: frontend/package-lock.json
      - name: Install locked dependencies
        working-directory: frontend
        run: npm ci --legacy-peer-deps
      - name: Mobile sidebar regression
        working-directory: frontend
        run: npm run test:unit -- app/components/sidebar/sidebar-base.test.tsx
      - name: Production static build and type checks
        working-directory: frontend
        run: npm run build
      - name: Prepare isolated image context
        run: |
          cp deployment/nova/Dockerfile frontend/Dockerfile.nova
          mkdir -p /tmp/nova-image
          cp frontend/Dockerfile.nova /tmp/nova-image/Dockerfile
          cp -a frontend/out /tmp/nova-image/out
      - uses: docker/setup-buildx-action@v3
      - name: Registry login
        if: github.event_name != 'pull_request' && (github.ref == 'refs/heads/nova/main' || startsWith(github.ref, 'refs/tags/nova-v'))
        uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}
      - name: Build and publish immutable commit image
        id: image
        uses: docker/build-push-action@v6
        with:
          context: /tmp/nova-image
          platforms: linux/amd64
          push: ${{ github.event_name != 'pull_request' && (github.ref == 'refs/heads/nova/main' || startsWith(github.ref, 'refs/tags/nova-v')) }}
          tags: ghcr.io/sup3rnova3/nova-pipeshub:sha-${{ github.sha }}
          build-args: SOURCE_REVISION=${{ github.sha }}
      - name: Record image digest
        env:
          DIGEST: ${{ steps.image.outputs.digest }}
        run: |
          echo "Source: $GITHUB_SHA" >> "$GITHUB_STEP_SUMMARY"
          echo "Image: ghcr.io/sup3rnova3/nova-pipeshub@$DIGEST" >> "$GITHUB_STEP_SUMMARY"
          echo "No automatic deployment. Promote the tested digest only." >> "$GITHUB_STEP_SUMMARY"
